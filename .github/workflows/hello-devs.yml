name: Draw HELLO DEVS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Draw contribution art
        shell: bash
        run: |
          if [ -f HELLO_DEVS_DONE ]; then
            echo "HELLO DEVS already generated."
            exit 0
          fi

          git config user.name "Jayasuryamahadevan"
          git config user.email "jayasuryamahadevan@gmail.com"

          python3 - <<'PY'
          import os
          import subprocess
          from datetime import date, datetime, time, timedelta, timezone

          TEXT = "HELLO DEVS"
          COMMITS_PER_PIXEL = 10

          FONT = {
              "H": [
                  "#..#",
                  "#..#",
                  "#..#",
                  "####",
                  "#..#",
                  "#..#",
                  "#..#",
              ],
              "E": [
                  "####",
                  "#...",
                  "#...",
                  "###.",
                  "#...",
                  "#...",
                  "####",
              ],
              "L": [
                  "#...",
                  "#...",
                  "#...",
                  "#...",
                  "#...",
                  "#...",
                  "####",
              ],
              "O": [
                  ".##.",
                  "#..#",
                  "#..#",
                  "#..#",
                  "#..#",
                  "#..#",
                  ".##.",
              ],
              "D": [
                  "###.",
                  "#..#",
                  "#..#",
                  "#..#",
                  "#..#",
                  "#..#",
                  "###.",
              ],
              "V": [
                  "#..#",
                  "#..#",
                  "#..#",
                  "#..#",
                  "#..#",
                  ".##.",
                  ".##.",
              ],
              "S": [
                  ".###",
                  "#...",
                  "#...",
                  ".##.",
                  "...#",
                  "...#",
                  "###.",
              ],
          }

          pixels = set()
          x = 0

          for char in TEXT:
              if char == " ":
                  x += 3
                  continue

              pattern = FONT[char]
              for y, row in enumerate(pattern):
                  for dx, cell in enumerate(row):
                      if cell == "#":
                          pixels.add((x + dx, y))
              x += 5

          width = max(px for px, _ in pixels) + 1

          today = date.today()
          days_since_sunday = (today.weekday() + 1) % 7
          this_sunday = today - timedelta(days=days_since_sunday)
          end_sunday = this_sunday - timedelta(days=7)
          start_sunday = end_sunday - timedelta(weeks=width - 1)

          for x, y in sorted(pixels):
              commit_day = start_sunday + timedelta(weeks=x, days=y)
              stamp = datetime.combine(
                  commit_day,
                  time(12, 0),
                  tzinfo=timezone.utc,
              ).isoformat()

              env = os.environ.copy()
              env["GIT_AUTHOR_DATE"] = stamp
              env["GIT_COMMITTER_DATE"] = stamp

              for n in range(COMMITS_PER_PIXEL):
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "--allow-empty",
                          "-m",
                          f"HELLO DEVS pixel {x}-{y}-{n+1}",
                      ],
                      check=True,
                      env=env,
                      stdout=subprocess.DEVNULL,
                  )

          with open("HELLO_DEVS_DONE", "w", encoding="utf-8") as f:
              f.write(
                  f"HELLO DEVS contribution art generated across {width} weeks.\n"
                  f"Start: {start_sunday.isoformat()}\n"
                  f"End week: {end_sunday.isoformat()}\n"
                  f"Commits per pixel: {COMMITS_PER_PIXEL}\n"
              )

          subprocess.run(["git", "add", "HELLO_DEVS_DONE"], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Complete HELLO DEVS contribution art"],
              check=True,
          )
          PY

          git push origin HEAD:main
