name: Randomize contributions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  randomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add random daily contributions
        shell: bash
        run: |
          git config user.name "Jayasuryamahadevan"
          git config user.email "jayasuryamahadevan@gmail.com"

          python3 - <<'PY'
          import os
          import random
          import subprocess
          from datetime import date, datetime, time, timedelta, timezone

          rng = random.Random(724193)

          end_day = date.today() - timedelta(days=1)
          start_day = end_day - timedelta(days=364)

          day = start_day
          while day <= end_day:
              count = rng.randint(20, 70)
              stamp = datetime.combine(
                  day,
                  time(12, 0),
                  tzinfo=timezone.utc,
              ).isoformat()

              env = os.environ.copy()
              env["GIT_AUTHOR_DATE"] = stamp
              env["GIT_COMMITTER_DATE"] = stamp

              for _ in range(count):
                  number = rng.randint(100000, 999999999)
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "--allow-empty",
                          "-m",
                          str(number),
                      ],
                      check=True,
                      env=env,
                      stdout=subprocess.DEVNULL,
                  )

              day += timedelta(days=1)
          PY

          git rm -f HELLO_DEVS_DONE || true
          git rm -f .github/workflows/hello-devs.yml || true
          git commit -m "84729163"
          git push origin HEAD:main
